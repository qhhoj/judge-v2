// QHHOJ judge <-> bridge contract. Package v1 is frozen for breaking changes:
// inside v1 only add fields, oneof members and enum values, never renumber,
// retype or rename; a removed field's number and name go to `reserved`.
// Fields are declared in field-number order. Readers ignore unknown fields.
// Every uint64 on the wire stays at or below 2^53 - 1 (9007199254740991): the
// TypeScript side decodes them as numbers and refuses larger values.
// A breaking change is a new package `qhhoj.judge.v2` served beside v1.
syntax = "proto3";

package qhhoj.judge.v1;

// The judge dials the bridge. Credentials travel as metadata
// `x-judge-name` and `x-judge-key`; nothing is read before they check out.
service JudgeLink {
  // One per judge. The judge's first message is Hello.
  rpc Session(stream JudgeMessage) returns (stream BridgeMessage);
  // The source of a file-only submission in chunks of at most 1 MiB,
  // only for a ref the calling judge's live session holds.
  rpc FetchSource(FetchSourceRequest) returns (stream Chunk);
  // Minor 2. The bundle of a generation (a zip of sources, headers and manual
  // inputs) in chunks of at most 1 MiB, only for a generation the calling
  // judge's live session holds.
  rpc FetchGenerationBundle(GenerationRequest) returns (stream Chunk);
  // Minor 2. The result zip of a generation; the first message names the
  // generation and the session, every message carries data. Accepted only for a
  // generation the calling judge's live session holds, at most once.
  rpc UploadGeneratedTests(stream UploadChunk) returns (UploadReceipt);
}

// One run of a submission; a rejudge or requeue is a new generation.
message AssignmentRef {
  string submission_id = 1;
  uint32 generation = 2;
}

message JudgeMessage {
  oneof body {
    Hello hello = 1;
    Pong pong = 2;
    Accepted accepted = 3;
    Compiled compiled = 4;
    GradingStarted started = 5;
    CaseResults cases = 6;
    Final final = 7;
    JudgeError error = 8;
    Draining draining = 9;
    GenerationDone generation_done = 10;
  }
}

message BridgeMessage {
  oneof body {
    Welcome welcome = 1;
    Ping ping = 2;
    Assign assign = 3;
    Abort abort = 4;
    ResultAck ack = 5;
    Disconnect disconnect = 6;
    BridgeError error = 7;
    GenerateTests generate = 8;
    CancelGeneration cancel_generation = 9;
  }
}

message Runtime {
  string language_key = 1;
  string name = 2;
  string version = 3;
}

// An assignment the judge still runs or holds unacked messages for.
message InFlight {
  AssignmentRef ref = 1;
  uint32 last_seq_sent = 2;
}

message Hello {
  uint32 protocol_minor = 1;
  string build = 2;
  uint32 slots = 3;
  repeated Runtime runtimes = 4;
  repeated string features = 5;
  repeated InFlight in_flight = 6;
}

message Resume {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_CONTINUE = 1;
    ACTION_DROP = 2;
  }
  AssignmentRef ref = 1;
  Action action = 2;
  // CONTINUE: replay the outbox from this seq. DROP: the judge stops the run and
  // still ends it with Final{OUTCOME_ABORTED}, which frees the bridge's slot. The
  // bridge stores nothing for that Final and does not ack it, so the judge drops
  // the run's outbox itself once the run has ended.
  uint32 from_seq = 3;
}

// Enforced by the bridge; the judge clamps its batches (cases per message) and
// its log clips to them.
message Limits {
  uint32 max_message_bytes = 1;
  uint32 max_cases_per_message = 2;
  uint32 max_cases_per_submission = 3;
  uint32 max_log_bytes = 4;
  uint32 max_feedback_bytes = 5;
  uint32 max_text_bytes = 6;
  uint32 max_messages_per_second = 7;
  uint32 accept_timeout_ms = 8;
  uint32 resume_grace_ms = 9;
}

message Welcome {
  string session_id = 1;
  uint32 protocol_minor = 2;
  repeated Resume resume = 3;
  Limits limits = 4;
  uint32 ping_interval_ms = 5;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
  uint32 busy = 2;
  double load = 3;
}

message Meta {
  // Participation number: 0 live, -1 spectate, n virtual; absent outside contests.
  optional sint32 in_contest = 1;
  uint32 attempt_no = 2;
  string user_id = 3;
}

message Assign {
  AssignmentRef ref = 1;
  string problem_code = 2;
  uint64 data_version = 3;
  string language_key = 4;
  // UTF-8 source; empty when source_is_file (fetch it with FetchSource).
  bytes source = 5;
  bool source_is_file = 6;
  uint64 source_size = 7;
  double time_limit_s = 8;
  uint64 memory_limit_kib = 9;
  bool short_circuit = 10;
  bool pretests_only = 11;
  Meta meta = 12;
}

// The judge ends every run it kills with Final{OUTCOME_ABORTED}, before or after
// Accepted; until then the bridge counts the run against the judge's slots. The
// bridge neither stores nor acks that Final: the judge drops the run's outbox itself.
message Abort {
  AssignmentRef ref = 1;
}

// Cumulative: every message of `ref` up to `seq` is stored.
message ResultAck {
  AssignmentRef ref = 1;
  uint32 seq = 2;
}

message Disconnect {
  bool forced = 1;
  string reason = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL = 1;
  ERROR_CODE_SLOTS_FULL = 2;
  ERROR_CODE_FLOOD = 3;
  ERROR_CODE_TOO_LARGE = 4;
  ERROR_CODE_SEQ_GAP = 5;
  // Not sent by the v1 bridge (a message for an unheld ref is answered with an
  // Abort); reserved for a later minor.
  ERROR_CODE_UNKNOWN_REF = 6;
  ERROR_CODE_INTERNAL = 7;
}

message BridgeError {
  ErrorCode code = 1;
  string message = 2;
}

message JudgeError {
  ErrorCode code = 1;
  string message = 2;
  AssignmentRef ref = 3;
}

// Per-assignment messages carry ref and seq (1, 2, ... per ref).
message Accepted {
  AssignmentRef ref = 1;
  uint32 seq = 2;
}

message Compiled {
  AssignmentRef ref = 1;
  uint32 seq = 2;
  string log = 3;
}

message GradingStarted {
  AssignmentRef ref = 1;
  uint32 seq = 2;
  bool pretested = 3;
  uint32 case_count = 4;
}

// Per-case verdict codes: AC accepted, WA wrong answer, TLE time limit, MLE memory limit, OLE output limit,
// IR invalid return (non-zero exit code), RTE runtime error (a signal or an uncaught exception), SC skipped
// (short-circuited by an earlier case or batch).
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_AC = 1;
  STATUS_WA = 2;
  STATUS_TLE = 3;
  STATUS_MLE = 4;
  STATUS_OLE = 5;
  STATUS_IR = 6;
  STATUS_RTE = 7;
  STATUS_SC = 8;
}

message Case {
  uint32 position = 1;
  Status status = 2;
  double time_s = 3;
  uint64 memory_kib = 4;
  double points = 5;
  double total = 6;
  // 0 = not in a batch, else the 1-based batch number.
  uint32 batch = 7;
  string feedback = 8;
  string extended_feedback = 9;
  string output_prefix = 10;
  // CPU seconds (isolate `time`) of the problem's own programs for this case: the custom checker, the
  // interactor and the interactive checker, summed. 0 for built-in checkers and skipped cases.
  double jury_time_s = 11;
}

message CaseResults {
  AssignmentRef ref = 1;
  uint32 seq = 2;
  repeated Case cases = 3;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_GRADED = 1;
  OUTCOME_COMPILE_ERROR = 2;
  OUTCOME_INTERNAL_ERROR = 3;
  OUTCOME_ABORTED = 4;
  OUTCOME_RETRY = 5;
}

// Why a judge could not run a submission. UNSUPPORTED is a refusal: the bridge does not offer the submission to
// that judge build again while the problem's data is the version it refused. DATA_UNAVAILABLE, RUNTIME_MISSING and
// SANDBOX_FAILURE are transient: the bridge requeues with a backoff, never counts them toward the RETRY cap, and
// ends the submission as an internal error only after a long bounded wait. UNSPECIFIED is a failure and counts
// toward the bridge's RETRY cap.
enum RetryReason {
  RETRY_REASON_UNSPECIFIED = 0;
  RETRY_REASON_DATA_UNAVAILABLE = 1;
  RETRY_REASON_UNSUPPORTED = 2;
  RETRY_REASON_RUNTIME_MISSING = 3;
  RETRY_REASON_SANDBOX_FAILURE = 4;
}

message Final {
  AssignmentRef ref = 1;
  uint32 seq = 2;
  Outcome outcome = 3;
  // Compile log (COMPILE_ERROR), message (INTERNAL_ERROR) or reason text (RETRY).
  string log = 4;
  RetryReason reason = 5;
  uint64 data_version_used = 6;
}

message Draining {}

message FetchSourceRequest {
  AssignmentRef ref = 1;
  string session_id = 2;
}

message Chunk {
  bytes data = 1;
}

// ---- Test generation (minor 2, feature "generate.polygon") ----
// A generation builds every test of a Polygon standard package: it runs the
// generators, the validator and the main solution in isolate and uploads a zip
// whose entries are the tests' input_name and answer_name. It takes one slot
// and is bound to the session that received it: it is not in the per-run
// outbox and does not survive a reconnect.

message GenerationProgram {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_GENERATOR = 1;
    ROLE_VALIDATOR = 2;
    ROLE_SOLUTION = 3;
    // Minor 3. Compiled only (compile check), never run.
    ROLE_CHECKER = 4;
    // Minor 3. Compiled only (compile check), never run.
    ROLE_INTERACTOR = 5;
  }
  // Unique in the generation; generators are named as in a test's command.
  string name = 1;
  Role role = 2;
  string language_key = 3;
  // Path of the source inside the bundle; every file in the same bundle
  // directory is copied beside it when compiling (headers).
  string source_path = 4;
}

message GenerationTest {
  // 1-based, as Polygon numbers tests.
  uint32 index = 1;
  // Names of the input and answer entries in the result zip.
  string input_name = 2;
  string answer_name = 3;
  // Polygon group, passed to the validator as --group; empty when none.
  string group = 4;
  // Exactly one: a manual test's input inside the bundle, or a generator run.
  string manual_path = 5;
  string generator = 6;
  repeated string args = 7;
}

message ProgramLimits {
  double time_s = 1;
  double wall_s = 2;
  uint64 memory_kib = 3;
}

message GenerationLimits {
  ProgramLimits generator = 1;
  ProgramLimits validator = 2;
  ProgramLimits solution = 3;
  // Cap of each generated input and answer.
  uint64 max_file_bytes = 4;
  // Cap of all inputs and answers together, uncompressed.
  uint64 max_total_bytes = 5;
  // Cap of the uploaded zip.
  uint64 max_upload_bytes = 6;
}

// A GenerateTests with no tests is a compile check (minor 3, feature
// "generate.compile"): every program must be a checker or an interactor and no
// solution is needed. The judge compiles them in order (testlib.h on the include
// path), stops at the first compile error (GenerationFailure with stage
// COMPILE, kind COMPILE_ERROR, the program's name and the compile log), and on
// success uploads an empty result zip and sends GenerationDone ok. With tests,
// checker and interactor programs are refused.
message GenerateTests {
  string generation_id = 1;
  uint64 bundle_size = 2;
  // Overall cap, from when the judge receives the message.
  uint32 deadline_s = 3;
  GenerationLimits limits = 4;
  repeated GenerationProgram programs = 5;
  repeated GenerationTest tests = 6;
  // The solution reads and writes these files instead of stdin and stdout
  // when both are set (problem.xml input-file / output-file).
  string input_file = 7;
  string output_file = 8;
}

message CancelGeneration {
  string generation_id = 1;
}

message GenerationRequest {
  string generation_id = 1;
  string session_id = 2;
}

message UploadChunk {
  // Read from the first message only.
  string generation_id = 1;
  string session_id = 2;
  bytes data = 3;
}

message UploadReceipt {
  uint64 bytes = 1;
}

message GenerationFailure {
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    STAGE_COMPILE = 1;
    STAGE_GENERATE = 2;
    STAGE_VALIDATE = 3;
    STAGE_SOLVE = 4;
    // The job as a whole: fetch, deadline, caps, upload, cancel.
    STAGE_JOB = 5;
  }
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_COMPILE_ERROR = 1;
    // Non-zero exit or a signal; detail says which.
    KIND_CRASHED = 2;
    KIND_TIME_LIMIT = 3;
    KIND_MEMORY_LIMIT = 4;
    KIND_OUTPUT_LIMIT = 5;
    // The validator exited non-zero; detail is its stderr.
    KIND_REJECTED = 6;
    KIND_MISSING_FILE = 7;
    KIND_UNSUPPORTED_LANGUAGE = 8;
    KIND_JOB_TIME_LIMIT = 9;
    KIND_INTERNAL = 10;
  }
  Stage stage = 1;
  Kind kind = 2;
  // The program's name, empty for job-level failures.
  string program = 3;
  // GenerationTest.index, 0 when not about one test.
  uint32 test_index = 4;
  // Compile log, validator stderr, exit code or signal; clipped to max_log_bytes.
  string detail = 5;
}

// Sent after the upload completed (ok) or instead of it (failure).
message GenerationDone {
  string generation_id = 1;
  bool ok = 2;
  GenerationFailure failure = 3;
}
