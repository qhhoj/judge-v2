name: 14-seq-gap
summary: A seq that skips one is a protocol error; the assignment then follows the lost-judge path.
applies_to: [bridge]
timings: {resumeGraceMs: 300}
setup:
  judges: [{name: j1}]
  problems: [{code: p1}]
  submissions: [{id: s1, problem: p1}]
steps:
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {protocolMinor: 0, build: conformance, slots: 2, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}]}}}
  - bridge: {to: j1, message: {welcome: {sessionId: "*"}}}
  - api: {judge: [s1]}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s1}}", generation: 1}}}}
  - judge: {from: j1, message: {accepted: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - judge: {from: j1, message: {started: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 3}}}
  - bridge: {to: j1, message: {error: {code: ERROR_CODE_SEQ_GAP}}}
  - closed: {judge: j1, status: INVALID_ARGUMENT}
  - wait: {ms: 800}
end_state:
  submissions:
    s1: {status: QU, requeueCount: 1, judgeGeneration: 1}
