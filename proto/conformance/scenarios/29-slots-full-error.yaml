name: 29-slots-full-error
summary: A judge reporting SLOTS_FULL broke the slot contract; the bridge closes the session.
applies_to: [bridge]
setup: {judges: [{name: j1}]}
steps:
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {protocolMinor: 0, build: conformance, slots: 2, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}]}}}
  - bridge: {to: j1, message: {welcome: {sessionId: "*"}}}
  - judge: {from: j1, message: {error: {code: ERROR_CODE_SLOTS_FULL, message: "2 slots, 3 assignments"}}}
  - bridge: {to: j1, message: {error: {code: ERROR_CODE_PROTOCOL}}}
  - closed: {judge: j1, status: INVALID_ARGUMENT}
