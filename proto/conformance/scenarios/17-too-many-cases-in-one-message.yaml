name: 17-too-many-cases-in-one-message
summary: More than 256 cases in one CaseResults is a protocol error.
applies_to: [bridge]
timings: {resumeGraceMs: 300}
setup:
  judges: [{name: j1}]
  problems: [{code: p1}]
  submissions: [{id: s1, problem: p1}]
steps:
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {protocolMinor: 0, build: conformance, slots: 2, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}]}}}
  - bridge: {to: j1, message: {welcome: {sessionId: "*"}}}
  - api: {judge: [s1]}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s1}}", generation: 1}}}}
  - judge: {from: j1, message: {accepted: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - judge: {from: j1, message: {started: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 2}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 2}}}
  - judge: {from: j1, message: {cases: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 3, cases: {$cases: [257, STATUS_AC]}}}}
  - bridge: {to: j1, message: {error: {code: ERROR_CODE_TOO_LARGE}}}
  - closed: {judge: j1, status: RESOURCE_EXHAUSTED}
end_state:
  submissions:
    s1: {caseCount: 0}
