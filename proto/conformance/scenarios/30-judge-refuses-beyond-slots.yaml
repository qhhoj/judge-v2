name: 30-judge-refuses-beyond-slots
summary: The judge answers an Assign beyond its slots with SLOTS_FULL.
applies_to: [judge]
setup:
  judges: [{name: j1}]
  problems: [{code: p1}]
  submissions: [{id: s1, problem: p1}, {id: s2, problem: p1}]
steps:
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {protocolMinor: 0, build: conformance, slots: 1, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}]}}}
  - bridge: {to: j1, message: {welcome: {sessionId: session-1}}}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s1}}", generation: 1}, problemCode: p1, languageKey: CPP17, source: aW50IG1haW4oKXt9, timeLimitS: 1, memoryLimitKib: "65536"}}}
  - judge: {from: j1, message: {accepted: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s2}}", generation: 1}, problemCode: p1, languageKey: CPP17, source: aW50IG1haW4oKXt9, timeLimitS: 1, memoryLimitKib: "65536"}}}
  - judge: {from: j1, message: {error: {code: ERROR_CODE_SLOTS_FULL, ref: {submissionId: "{{s2}}", generation: 1}}}}
