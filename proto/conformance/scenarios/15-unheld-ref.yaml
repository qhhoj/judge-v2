name: 15-unheld-ref
summary: A message for a ref the session does not hold (another generation, an unknown id) is ignored and answered with one Abort.
applies_to: [bridge]
setup:
  judges: [{name: j1}]
  problems: [{code: p1}]
  submissions: [{id: s1, problem: p1}]
steps:
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {protocolMinor: 0, build: conformance, slots: 2, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}]}}}
  - bridge: {to: j1, message: {welcome: {sessionId: "*"}}}
  - api: {judge: [s1]}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s1}}", generation: 1}}}}
  - judge: {from: j1, message: {accepted: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - judge: {from: j1, message: {started: {ref: {submissionId: "{{s1}}", generation: 7}, seq: 2}}}
  - bridge: {to: j1, message: {abort: {ref: {submissionId: "{{s1}}", generation: 7}}}}
  - judge: {from: j1, message: {cases: {ref: {submissionId: "01920000-0000-7000-8000-00000000dead", generation: 1}, seq: 2, cases: [{position: 1, status: STATUS_AC}]}}}
  - bridge: {to: j1, message: {abort: {ref: {submissionId: "01920000-0000-7000-8000-00000000dead", generation: 1}}}}
  - judge: {from: j1, message: {final: {ref: {submissionId: "{{s1}}", generation: 7}, seq: 3, outcome: OUTCOME_ABORTED}}}
  - quiet: {to: j1, ms: 300}
  - judge: {from: j1, message: {started: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 2, caseCount: 1}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 2}}}
end_state:
  submissions:
    s1: {status: G, judgeSeq: 2, caseCount: 0}
