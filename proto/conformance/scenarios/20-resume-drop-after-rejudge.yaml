name: 20-resume-drop-after-rejudge
summary: A run rejudged while its judge was away is dropped on resume; the judge ends it with Final ABORTED and the new generation is assigned.
applies_to: [bridge, judge]
timings: {resumeGraceMs: 3000}
setup:
  judges: [{name: j1}]
  problems: [{code: p1}]
  submissions: [{id: s1, problem: p1}]
steps:
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {protocolMinor: 0, build: conformance, slots: 2, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}]}}}
  - bridge: {to: j1, message: {welcome: {sessionId: "*"}}}
  - api: {judge: [s1]}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s1}}", generation: 1}}}}
  - judge: {from: j1, message: {accepted: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 1}}}
  - drop: {judge: j1}
  - api: {rejudge: s1}
  - wait: {ms: 200}
  - open: {judge: j1}
  - judge: {from: j1, message: {hello: {slots: 2, runtimes: [{languageKey: CPP17, name: g++, version: "13.2"}], inFlight: [{ref: {submissionId: "{{s1}}", generation: 1}, lastSeqSent: 1}]}}}
  - bridge: {to: j1, message: {welcome: {resume: [{ref: {submissionId: "{{s1}}", generation: 1}, action: ACTION_DROP}]}}}
  - judge: {from: j1, message: {final: {ref: {submissionId: "{{s1}}", generation: 1}, seq: 2, outcome: OUTCOME_ABORTED}}}
  - bridge: {to: j1, message: {assign: {ref: {submissionId: "{{s1}}", generation: 2}}}}
  - judge: {from: j1, message: {accepted: {ref: {submissionId: "{{s1}}", generation: 2}, seq: 1}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 2}, seq: 1}}}
  - judge: {from: j1, message: {final: {ref: {submissionId: "{{s1}}", generation: 2}, seq: 2, outcome: OUTCOME_COMPILE_ERROR, log: x}}}
  - bridge: {to: j1, message: {ack: {ref: {submissionId: "{{s1}}", generation: 2}, seq: 2}}}
end_state:
  submissions:
    s1: {status: CE, judgeGeneration: 2, requeueCount: 0}
