# No SCRATCH entry: Scratch is dropped (user ruling); SCRATCH problems are refused with RETRY RUNTIME_MISSING.
# languages.toml — one [[language]] per key. Commands run inside the isolate box with cwd /box.
# C/C++ and Pascal compile with ONLINE_JUDGE defined (the usual `#ifndef ONLINE_JUDGE freopen` template).
# Placeholders: {memory_kib} {memory_mib} (the run memory limit), {class} (JVM public class).
# In dirs/compile_dirs, {jdk_etc} is /etc/java-NN-openjdk of the JDK /usr/lib/jvm/default-java links to
# (resolved at load; a language whose directory is missing on the host is not advertised).
# compile_processes defaults to 32, processes to 1. A missing compiler only disables its language (selftest).

[[language]]
key = "C"
name = "C (gcc, gnu99)"
source = "main.c"
compile = ["/usr/bin/gcc", "-std=gnu99", "-O2", "-pipe", "-DONLINE_JUDGE", "-o", "main", "main.c", "-lm"]
run = ["./main"]
version = ["/usr/bin/gcc", "-dumpfullversion"]
signature = ["/usr/bin/gcc", "-std=gnu99", "-O2", "-pipe", "-DONLINE_JUDGE"]

