[[language]]
key = "PY3"
name = "Python 3"
source = "main.py"
compile = ["/usr/bin/python3", "-m", "py_compile", "main.py"]
run = ["/usr/bin/python3", "-B", "main.py"]
version = ["/usr/bin/python3", "--version"]
exception_marker = "Traceback (most recent call last)"
exception_style = "last_line"

[[language]]
key = "PYPY3"
name = "PyPy 3"
source = "main.py"
# A syntax error is CE, as for PY3; running main.py never reads the cached .pyc.
compile = ["/usr/bin/pypy3", "-m", "py_compile", "main.py"]
run = ["/usr/bin/pypy3", "main.py"]
version = ["/usr/bin/pypy3", "--version"]
exception_marker = "Traceback (most recent call last)"
exception_style = "last_line"

[[language]]
key = "PAS"
name = "Pascal (fpc)"
source = "main.pas"
# -n: skip the system fpc config (isolate does not mount etc); the unit paths fpc.cfg would add are given here.
compile = ["/usr/bin/fpc", "-n", "-Fu/usr/lib/x86_64-linux-gnu/fpc/$fpcversion/units/$fpctarget", "-Fu/usr/lib/x86_64-linux-gnu/fpc/$fpcversion/units/$fpctarget/*", "-Fu/usr/lib/x86_64-linux-gnu/fpc/$fpcversion/units/$fpctarget/rtl", "-O2", "-XS", "-Sg", "-dONLINE_JUDGE", "-omain", "main.pas"]
run = ["./main"]
# /usr/bin/ppcx64 and fpc's own config resolve through the /etc/alternatives symlinks; the box has no /etc.
compile_dirs = ["/etc/alternatives"]
version = ["/usr/bin/fpc", "-iV"]
testlib_flag = "-Fu/testlib"

[[language]]
key = "JAVA"
name = "Java"
source = "{class}.java"
compile = ["/usr/lib/jvm/default-java/bin/javac", "-J-XX:+UseSerialGC", "-J-XX:MaxRAM=14311944k", "-encoding", "UTF-8", "{class}.java"]
compile_processes = 128
# The JVM sizes its initial heap, and so its young generation and GC count, from the host's RAM (isolate mounts no
# /sys, so not from the box's cgroup). -XX:MaxRAM fixes that input on every host to the RAM of the production host
# that judged since 2026-10-10 (14311944 kB): its heap flags stay as they were, and reported memory and time stop
# depending on the host. javac gets the same pin.
# isolate's `time` sums every thread of the box, the JIT's too; each box runs under `taskset -c <core>`, so the JVM
# sizes them from 1 CPU on any host (2 compilers; 12 on 16 unpinned cores): no -XX:ActiveProcessorCount needed.
run = ["/usr/lib/jvm/default-java/bin/java", "-Xmx{memory_mib}m", "-XX:MaxRAM=14311944k", "-Xss64m", "-XX:+UseSerialGC", "{class}"]
processes = 64
jvm = true
# The JDK's conf/ and lib/security/ are symlinks into /etc/java-NN-openjdk ({jdk_etc}): bound read-only,
# or the JVM dies with "Error loading java.security file".
dirs = ["{jdk_etc}"]
compile_dirs = ["{jdk_etc}"]
version = ["/usr/lib/jvm/default-java/bin/javac", "-version"]
exception_marker = "Exception in thread"

# JAVA8: 0 submissions in 2 years (legacy-judge-usage.md) but allowed on every problem: an alias of JAVA's JDK.
[[language]]
key = "JAVA8"
name = "Java 8 (alias of the installed JDK)"
source = "{class}.java"
compile = ["/usr/lib/jvm/default-java/bin/javac", "-J-XX:+UseSerialGC", "-J-XX:MaxRAM=14311944k", "-encoding", "UTF-8", "{class}.java"]
compile_processes = 128
# The JVM sizes its initial heap, and so its young generation and GC count, from the host's RAM (isolate mounts no
# /sys, so not from the box's cgroup). -XX:MaxRAM fixes that input on every host to the RAM of the production host
# that judged since 2026-10-10 (14311944 kB): its heap flags stay as they were, and reported memory and time stop
# depending on the host. javac gets the same pin.
# isolate's `time` sums every thread of the box, the JIT's too; each box runs under `taskset -c <core>`, so the JVM
# sizes them from 1 CPU on any host (2 compilers; 12 on 16 unpinned cores): no -XX:ActiveProcessorCount needed.
run = ["/usr/lib/jvm/default-java/bin/java", "-Xmx{memory_mib}m", "-XX:MaxRAM=14311944k", "-Xss64m", "-XX:+UseSerialGC", "{class}"]
processes = 64
jvm = true
# The JDK's conf/ and lib/security/ are symlinks into /etc/java-NN-openjdk ({jdk_etc}): bound read-only,
# or the JVM dies with "Error loading java.security file".
dirs = ["{jdk_etc}"]
compile_dirs = ["{jdk_etc}"]
version = ["/usr/lib/jvm/default-java/bin/javac", "-version"]
exception_marker = "Exception in thread"

[[language]]
key = "KOTLIN"
name = "Kotlin"
source = "main.kt"
# kotlinc is a shell script that finds java through JAVA_HOME; /usr/bin/java would go through /etc/alternatives.
compile = ["/usr/bin/env", "JAVA_HOME=/usr/lib/jvm/default-java", "/usr/local/lib/kotlinc/bin/kotlinc", "main.kt", "-include-runtime", "-d", "main.jar"]
compile_limits = { time_s = 30.0, wall_s = 60.0, memory_kib = 2097152 }
compile_processes = 128
# The JVM sizes its initial heap, and so its young generation and GC count, from the host's RAM (isolate mounts no
# /sys, so not from the box's cgroup). -XX:MaxRAM fixes that input on every host to the RAM of the production host
# that judged since 2026-10-10 (14311944 kB): its heap flags stay as they were, and reported memory and time stop
# depending on the host. kotlinc's launcher pins its own heap (-Xmx512M -Xms128M).
# isolate's `time` sums every thread of the box, the JIT's too; each box runs under `taskset -c <core>`, so the JVM
# sizes them from 1 CPU on any host (2 compilers; 12 on 16 unpinned cores): no -XX:ActiveProcessorCount needed.
run = ["/usr/lib/jvm/default-java/bin/java", "-Xmx{memory_mib}m", "-XX:MaxRAM=14311944k", "-Xss64m", "-XX:+UseSerialGC", "-jar", "main.jar"]
processes = 64
jvm = true
# The JDK's conf/ and lib/security/ are symlinks into /etc/java-NN-openjdk ({jdk_etc}): bound read-only,
# or the JVM dies with "Error loading java.security file".
dirs = ["{jdk_etc}"]
compile_dirs = ["{jdk_etc}"]
version = ["/usr/bin/env", "JAVA_HOME=/usr/lib/jvm/default-java", "/usr/local/lib/kotlinc/bin/kotlinc", "-version"]
exception_marker = "Exception in thread"

[[language]]
key = "RUBY"
name = "Ruby"
source = "main.rb"
run = ["/usr/bin/ruby", "main.rb"]
# Ruby starts a timer thread: with processes = 1 it hangs at exit until the wall limit.
processes = 4
version = ["/usr/bin/ruby", "--version"]
exception_marker = "main.rb:"
exception_style = "parenthesized"

