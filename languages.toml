[[language]]
key = "PY3"
name = "Python 3"
source = "main.py"
compile = ["/usr/bin/python3", "-m", "py_compile", "main.py"]
run = ["/usr/bin/python3", "-B", "main.py"]
version = ["/usr/bin/python3", "--version"]
exception_marker = "Traceback (most recent call last)"
exception_style = "last_line"

[[language]]
key = "PYPY3"
name = "PyPy 3"
source = "main.py"
# A syntax error is CE, as for PY3; running main.py never reads the cached .pyc.
compile = ["/usr/bin/pypy3", "-m", "py_compile", "main.py"]
run = ["/usr/bin/pypy3", "main.py"]
# PyPy sizes its GC nursery from the /proc/cpuinfo "cache size" (half of it): 130 MiB on a Xeon 8573C (260 MiB
# L3), 256 KiB on an EPYC 7763 (it reports L2). A fixed nursery keeps memory and GC cost the same on every host.
env = { PYPY_GC_NURSERY = "4M" }
version = ["/usr/bin/pypy3", "--version"]
exception_marker = "Traceback (most recent call last)"
exception_style = "last_line"

[[language]]
key = "PAS"
name = "Pascal (fpc)"
source = "main.pas"
# -n: skip the system fpc config (isolate does not mount etc); the unit paths fpc.cfg would add are given here.
compile = ["/usr/bin/fpc", "-n", "-Fu/usr/lib/x86_64-linux-gnu/fpc/$fpcversion/units/$fpctarget", "-Fu/usr/lib/x86_64-linux-gnu/fpc/$fpcversion/units/$fpctarget/*", "-Fu/usr/lib/x86_64-linux-gnu/fpc/$fpcversion/units/$fpctarget/rtl", "-O2", "-XS", "-Sg", "-dONLINE_JUDGE", "-omain", "main.pas"]
run = ["./main"]
# /usr/bin/ppcx64 and fpc's own config resolve through the /etc/alternatives symlinks; the box has no /etc.
compile_dirs = ["/etc/alternatives"]
version = ["/usr/bin/fpc", "-iV"]
testlib_flag = "-Fu/testlib"

[[language]]
key = "JAVA"
name = "Java"
source = "{class}.java"
compile = ["/usr/lib/jvm/default-java/bin/javac", "-J-XX:+UseSerialGC", "-encoding", "UTF-8", "{class}.java"]
compile_processes = 128
run = ["/usr/lib/jvm/default-java/bin/java", "-Xmx{memory_mib}m", "-Xss64m", "-XX:+UseSerialGC", "{class}"]
processes = 64
jvm = true
# The JDK's conf/ and lib/security/ are symlinks into /etc/java-21-openjdk (Ubuntu 24.04 default-jdk): bound read-only,
# or the JVM dies with "Error loading java.security file". Update the path when the distro's JDK major changes.
dirs = ["/etc/java-21-openjdk"]
compile_dirs = ["/etc/java-21-openjdk"]
version = ["/usr/lib/jvm/default-java/bin/javac", "-version"]
exception_marker = "Exception in thread"

# JAVA8: 0 submissions in 2 years (legacy-judge-usage.md) but allowed on every problem: an alias of JAVA's JDK.
[[language]]
key = "JAVA8"
name = "Java 8 (alias of the installed JDK)"
source = "{class}.java"
compile = ["/usr/lib/jvm/default-java/bin/javac", "-J-XX:+UseSerialGC", "-encoding", "UTF-8", "{class}.java"]
compile_processes = 128
run = ["/usr/lib/jvm/default-java/bin/java", "-Xmx{memory_mib}m", "-Xss64m", "-XX:+UseSerialGC", "{class}"]
processes = 64
jvm = true
# The JDK's conf/ and lib/security/ are symlinks into /etc/java-21-openjdk (Ubuntu 24.04 default-jdk): bound read-only,
# or the JVM dies with "Error loading java.security file". Update the path when the distro's JDK major changes.
dirs = ["/etc/java-21-openjdk"]
compile_dirs = ["/etc/java-21-openjdk"]
version = ["/usr/lib/jvm/default-java/bin/javac", "-version"]
exception_marker = "Exception in thread"

[[language]]
key = "KOTLIN"
name = "Kotlin"
source = "main.kt"
# kotlinc is a shell script that finds java through JAVA_HOME; /usr/bin/java would go through /etc/alternatives.
compile = ["/usr/bin/env", "JAVA_HOME=/usr/lib/jvm/default-java", "/usr/local/lib/kotlinc/bin/kotlinc", "main.kt", "-include-runtime", "-d", "main.jar"]
compile_limits = { time_s = 30.0, wall_s = 60.0, memory_kib = 2097152 }
compile_processes = 128
run = ["/usr/lib/jvm/default-java/bin/java", "-Xmx{memory_mib}m", "-Xss64m", "-XX:+UseSerialGC", "-jar", "main.jar"]
processes = 64
jvm = true
# The JDK's conf/ and lib/security/ are symlinks into /etc/java-21-openjdk (Ubuntu 24.04 default-jdk): bound read-only,
# or the JVM dies with "Error loading java.security file". Update the path when the distro's JDK major changes.
dirs = ["/etc/java-21-openjdk"]
compile_dirs = ["/etc/java-21-openjdk"]
version = ["/usr/bin/env", "JAVA_HOME=/usr/lib/jvm/default-java", "/usr/local/lib/kotlinc/bin/kotlinc", "-version"]
exception_marker = "Exception in thread"

[[language]]
key = "RUBY"
name = "Ruby"
source = "main.rb"
run = ["/usr/bin/ruby", "main.rb"]
# Ruby starts a timer thread: with processes = 1 it hangs at exit until the wall limit.
processes = 4
version = ["/usr/bin/ruby", "--version"]
exception_marker = "main.rb:"
exception_style = "parenthesized"

[[language]]
key = "D"
name = "D (gdc)"
source = "main.d"
compile = ["/usr/bin/gdc", "-O2", "-o", "main", "main.d"]
run = ["./main"]
version = ["/usr/bin/gdc", "-dumpfullversion"]

[[language]]
key = "LUA"
name = "Lua 5.4"
source = "main.lua"
run = ["/usr/bin/lua5.4", "main.lua"]
version = ["/usr/bin/lua5.4", "-v"]
exception_marker = "stack traceback:"
exception_style = "line_above"

[[language]]
key = "ADA"
name = "Ada (gnat)"
source = "main.adb"
compile = ["/usr/bin/gnatmake", "-O2", "-o", "main", "main.adb"]
run = ["./main"]
version = ["/usr/bin/gnat", "--version"]
exception_marker = "raised "

[[language]]
key = "BF"
name = "Brainfuck"
source = "main.bf"
run = ["/usr/bin/bf", "main.bf"]
version = ["/usr/bin/dpkg-query", "-W", "-f=${Version}", "bf"]

[[language]]
key = "GAS64"
name = "Assembly x86-64 (gas)"
source = "main.s"
compile = ["/bin/sh", "-c", "/usr/bin/as --64 -o main.o main.s && /usr/bin/ld -o main main.o"]
run = ["./main"]
version = ["/usr/bin/as", "--version"]

[[language]]
key = "TEXT"
name = "Text (the source is the answer)"
source = "main.txt"
kind = "text"
run = []
version = []

[[language]]
key = "OUTPUT"
name = "Output-only (zip of outputs)"
source = "main.zip"
kind = "output_zip"
file_only = true
run = []
version = []
