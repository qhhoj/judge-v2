# packaging/nftables-judge.conf: judge host firewall. Install as /etc/nftables.conf, fill the defines, then:
#   nft -c -f /etc/nftables.conf && nft -f /etc/nftables.conf && systemctl enable nftables
# Remote judge (site reached over WireGuard): keep the WireGuard rule. Judge on the site's private LAN: delete it
# and set BRIDGE to the site host's LAN address.
flush ruleset
define SITE_PUBLIC = 203.0.113.10 # site host public IP (WireGuard endpoint)
define WG_PORT = 51820            # site host WireGuard UDP port
define BRIDGE = 10.77.0.1         # site host address inside the tunnel (bridge and NFS)
define BRIDGE_PORT = 9990
define ADMIN_NET = 198.51.100.0/24  # where SSH comes from
define RESOLVER = 1.1.1.1         # DNS
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr $ADMIN_NET tcp dport 22 accept
    icmp type echo-request limit rate 5/second accept
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    ip daddr $SITE_PUBLIC udp dport $WG_PORT accept                 # WireGuard tunnel to the site host
    ip daddr $BRIDGE tcp dport { $BRIDGE_PORT, 2049 } accept         # bridge (gRPC/TLS) and NFS, inside the tunnel
    ip daddr $RESOLVER udp dport 53 accept
    udp dport 123 accept
    tcp dport { 80, 443 } meta skuid { 0, "_apt" } accept   # apt (root, and its _apt download sandbox user) only
  }
  chain forward { type filter hook forward priority 0; policy drop; }
}
