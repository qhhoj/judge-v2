[workspace]
resolver = "3"
members = [
    "crates/judge-proto",
    "crates/conformance",
    "crates/problem",
    "crates/sandbox",
    "crates/grader",
    "crates/daemon",
    "crates/cli",
    "crates/interface",
]

[workspace.package]
edition = "2024"
version = "2.3.9"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
pbjson = "=0.9.0"
pbjson-types = "=0.9.0"
pbjson-build = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "=0.9.42"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
thiserror = "2"
judge-problem = { path = "crates/problem" }
judge-sandbox = { path = "crates/sandbox" }
judge-grader = { path = "crates/grader" }
judge-daemon = { path = "crates/daemon" }
judge-proto = { path = "crates/judge-proto" }
judge-interface = { path = "crates/interface" }
conformance = { path = "crates/conformance" }
anyhow = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = { version = "0.13", default-features = false }
rand = "0.9"
regex = "1"
tempfile = "3"
libc = "0.2"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
http = "1"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "deny"
