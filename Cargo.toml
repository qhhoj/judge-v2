[workspace]
resolver = "3"
members = ["crates/judge-proto", "crates/conformance"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
prost = "=0.14.4"
prost-types = "=0.14.4"
pbjson = "=0.9.0"
pbjson-types = "=0.9.0"
pbjson-build = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "=0.9.42"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
thiserror = "2"

[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "deny"
