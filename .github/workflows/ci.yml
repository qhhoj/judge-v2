name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # rust-toolchain.toml pins the compiler, rustfmt and clippy
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - name: golden binaries match their JSON
        run: |
          cargo run -q -p judge-proto --example write_golden
          git diff --exit-code -- proto/golden
      - name: the v1 shape file is current
        run: |
          cargo run -q -p judge-proto --example bless_shape
          git diff --exit-code -- proto/compat
