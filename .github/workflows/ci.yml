# Pushes run change-file (PRs), rust, release and image; a v* tag push also publishes the GitHub Release. The isolate suite needs a tuned judge host (SMT off, no swap,
# pinned governor); on a stock GitHub runner Pascal/Java/Kotlin compiles and a few limit verdicts differ, so it runs
# only by hand (Actions -> ci -> Run workflow) and, authoritatively, as `selftest --require` on each judge host.
name: ci
on: { push: { branches: [main], tags: ['v*'] }, pull_request: {}, workflow_dispatch: {} }
# Third-party actions are pinned by commit SHA (the comment names the tag); bump them deliberately.
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
jobs:
  change-file:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: the PR adds a change file
        run: |
          git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- '.changeset/*.md' | grep -v '^.changeset/README.md$' | grep -q . \
            || { echo "no new .changeset/*.md: run knope document-change"; exit 1; }
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the shape check reads the released proto-v1.* tags
      - uses: ./.github/actions/setup-protoc
      # rust-toolchain.toml pins the compiler, rustfmt and clippy
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      - name: golden binaries match their JSON
        run: |
          cargo run --locked -q -p judge-proto --example write_golden
          git diff --exit-code -- proto/golden
      - name: the v1 shape file is current
        run: |
          cargo run --locked -q -p judge-proto --example bless_shape
          git diff --exit-code -- proto/compat
      - name: no breaking change against the latest released proto tag
        run: |
          tag=$(git tag -l 'proto-v1.*' --sort=-v:refname | head -n 1)
          test -n "$tag" || { echo "no proto-v1.* tag yet"; exit 0; }
          git show "$tag:proto/compat/v1.shape.json" > "$RUNNER_TEMP/released.shape.json"
          cargo run --locked -q -p judge-proto --example check_shape -- "$RUNNER_TEMP/released.shape.json"
      - name: the systemd unit keeps its directives
        run: bash packaging/check-unit.sh
      - name: check-host.sh fails each broken host setting
        run: bash packaging/check-host.test.sh
  # By hand only (see the header): needs sudo, systemd and cgroup v2 delegation.
  isolate-suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: rust
    timeout-minutes: 60
    env:
      JUDGE_SUITE_REQUIRE: C,C11,CLANG,CPP03,CPP11,CPP14,CPP17,CPP20,CPP23,CLANGX,PY3,PYPY3,PAS,JAVA,JAVA8,KOTLIN,RUBY,D,LUA,ADA,GAS64,TEXT
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-protoc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: compilers and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-dev libseccomp-dev libsystemd-dev pkg-config asciidoc-base unzip \
            gcc g++ clang fp-compiler python3 pypy3 default-jdk-headless ruby gdc lua5.4 gnat binutils
      - name: host CPU (PyPy sizes its GC nursery from the cache size it reads)
        run: |
          grep -m2 -E '^(model name|cache size)' /proc/cpuinfo
          PYPYLOG=gc-hardware:- pypy3 -c pass
      - name: Kotlin (upstream release, pinned by sha256)
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotlinc.zip" https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip
          echo "1ba08a8b45da99339a0601134cc037b54cf85e9bc0edbe76dcbd27c2d684a977  $RUNNER_TEMP/kotlinc.zip" | sha256sum -c
          sudo unzip -q "$RUNNER_TEMP/kotlinc.zip" -d /usr/local/lib
          JAVA_HOME=/usr/lib/jvm/default-java /usr/local/lib/kotlinc/bin/kotlinc -version
      - name: build and start isolate 2.6 (cgroups v2)
        run: |
          # setuid root once installed: pinned to the commit of tag v2.6, verified after the checkout
          git clone https://github.com/ioi/isolate "$RUNNER_TEMP/isolate"
          cd "$RUNNER_TEMP/isolate"
          git checkout --detach 19ec4bd3fac386ae4cb95a7d43d8188710154661
          test "$(git rev-parse HEAD)" = 19ec4bd3fac386ae4cb95a7d43d8188710154661
          make isolate isolate-cg-keeper
          sudo make install
          sudo cp systemd/isolate.service systemd/isolate.slice /etc/systemd/system/
          # the shipped config takes its box uid/gid range from this user (DEPLOY.md step 2)
          sudo useradd --system isolate
          sudo usermod --add-subuids 200000-265535 --add-subgids 200000-265535 isolate
          sudo systemctl daemon-reload
          sudo systemctl start isolate.service || { sudo journalctl -u isolate.service --no-pager -n 50; exit 1; }
          isolate --version
          isolate --cg -b 0 --init && isolate --cg -b 0 --cleanup
      - name: isolate tests (one test thread, the tests share isolate boxes)
        run: cargo test --locked -p judge-sandbox -p judge-grader -p judge-daemon -p judge-cli --features isolate -- --test-threads=1
      - name: selftest (host copy of languages.toml, every CI language required)
        run: |
          cargo run --locked -q -p judge-cli --features isolate -- selftest --languages languages.toml --testlib assets/testlib \
            --host-languages "$RUNNER_TEMP/languages.host.toml" \
            --require "$JUDGE_SUITE_REQUIRE"
  # The container image (packaging/Containerfile). Pull requests only build it (so this can be a required check); pushes to main and v* tags also
  # push it to ghcr.io/qhhoj/judge-v2 (:sha-<12>, :main, and :vX.Y.Z on tags). The isolate selftest needs cgroup delegation, SYS_ADMIN and a tuned
  # host, so it is not run here: the smoke test checks the binary and isolate only.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/qhhoj/judge-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build into the local image store
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/Containerfile
          load: true
          tags: judge-image:smoke
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (entrypoint skipped, it needs a writable cgroup)
        run: |
          docker run --rm --entrypoint qhhoj-judge judge-image:smoke --version
          docker run --rm --entrypoint isolate judge-image:smoke --version
          docker run --rm --entrypoint /usr/local/lib/kotlinc/bin/kotlinc -e JAVA_HOME=/usr/lib/jvm/default-java judge-image:smoke -version
          docker image inspect judge-image:smoke --format '{{ index .Config.Labels "org.opencontainers.image.revision" }} {{ .Size }} bytes'
      - name: tags
        if: github.event_name != 'pull_request'
        id: tags
        run: |
          tags="$IMAGE:sha-${GITHUB_SHA::12}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags="$tags,$IMAGE:main"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags,$IMAGE:${GITHUB_REF_NAME}"; fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"
      - name: log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push (layers come from the cache)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/Containerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
  # The release tarball (static musl binary + packaging + DEPLOY.md) as a workflow artifact; on a v* tag it is also
  # published as a GitHub Release (tarball + .sha256).
  release:
    runs-on: ubuntu-24.04
    needs: rust
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-protoc
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # version = the Cargo workspace version (knope bumps it); main builds add +<sha> build metadata, tags do not
      - name: build the tarball
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo version $version"; exit 1; }
            bash packaging/build-release.sh
          else
            RELEASE_SUFFIX="+${GITHUB_SHA::12}" bash packaging/build-release.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qhhoj-judge
          path: target/release-pkg/*.tar.gz
      - name: publish the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/release-pkg
          sha256sum ./*.tar.gz | sed 's# \./# #' > "qhhoj-judge-${GITHUB_REF_NAME#v}.tar.gz.sha256"
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz ./*.sha256 --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "Judge $GITHUB_REF_NAME. Install: DEPLOY.md step 8 inside the tarball; changes: CHANGELOG.md."
